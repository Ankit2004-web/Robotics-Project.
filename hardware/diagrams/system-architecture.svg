<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Anti Sleep Alarm system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4ef"/>
      <stop offset="100%" stop-color="#ffe8e2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f06000"/>
      <stop offset="100%" stop-color="#c01020"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#c01020">System Architecture</text>
  <text x="500" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7a4a45">Anti Sleep Alarm | Autonomous Wheel Robot</text>

  <rect x="340" y="100" rx="16" ry="16" width="320" height="70" fill="#ffffff" stroke="#f06000" stroke-width="3"/>
  <text x="500" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1214">Blink Sensor (IR TX/RX)</text>

  <line x1="500" y1="170" x2="500" y2="195" stroke="#f06000" stroke-width="3"/>
  <polygon points="500,210 490,192 510,192" fill="#f06000"/>

  <rect x="300" y="215" rx="18" ry="18" width="400" height="95" fill="url(#accent)"/>
  <text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Arduino UNO</text>
  <text x="500" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffe6dc">Drowsiness Detection State Machine</text>

  <line x1="400" y1="310" x2="250" y2="365" stroke="#f06000" stroke-width="3"/>
  <polygon points="242,372 250,352 264,366" fill="#f06000"/>
  <line x1="600" y1="310" x2="750" y2="365" stroke="#f06000" stroke-width="3"/>
  <polygon points="758,372 736,366 750,352" fill="#f06000"/>

  <rect x="120" y="375" rx="16" ry="16" width="260" height="75" fill="#ffffff" stroke="#f06000" stroke-width="3"/>
  <text x="250" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f06000">Piezo Buzzer (D12)</text>

  <rect x="620" y="375" rx="16" ry="16" width="260" height="75" fill="#ffffff" stroke="#c01020" stroke-width="3"/>
  <text x="750" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#c01020">Relay Module (D13)</text>

  <line x1="750" y1="450" x2="750" y2="485" stroke="#c01020" stroke-width="3"/>
  <polygon points="750,500 740,482 760,482" fill="#c01020"/>

  <rect x="620" y="510" rx="16" ry="16" width="260" height="60" fill="#c01020"/>
  <text x="750" y="547" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Hobby Motor (9V)</text>

  <text x="500" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7a4a45">Logic: Arduino 5V peripherals  |  Load: 9V motor via relay</text>
</svg>
