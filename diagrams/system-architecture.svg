<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Anti Sleep Alarm system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1f33" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="url(#bg)"/>
  <text x="460" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#102a43">System Architecture</text>
  <text x="460" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#486581">Anti Sleep Alarm  Autonomous Wheel Robot</text>

  <!-- Sensor -->
  <rect x="320" y="95" rx="12" ry="12" width="280" height="58" fill="#ffffff" stroke="#334e68" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#102a43">Blink Sensor (IR TX/RX)</text>

  <line x1="460" y1="153" x2="460" y2="185" stroke="#334e68" stroke-width="2.5"/>
  <polygon points="460,195 453,180 467,180" fill="#334e68"/>

  <!-- Arduino -->
  <rect x="300" y="200" rx="12" ry="12" width="320" height="78" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="460" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Arduino UNO</text>
  <text x="460" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d9e8ff">Drowsiness Detection State Machine</text>

  <line x1="380" y1="278" x2="250" y2="330" stroke="#334e68" stroke-width="2.5"/>
  <polygon points="244,338 246,322 260,332" fill="#334e68"/>
  <line x1="540" y1="278" x2="670" y2="330" stroke="#334e68" stroke-width="2.5"/>
  <polygon points="676,338 660,332 674,322" fill="#334e68"/>

  <!-- Buzzer -->
  <rect x="140" y="345" rx="12" ry="12" width="220" height="64" fill="#ffffff" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="250" y="383" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#92400e">Piezo Buzzer (D12)</text>

  <!-- Relay -->
  <rect x="560" y="345" rx="12" ry="12" width="220" height="64" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="670" y="383" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#115e59">Relay Module (D13)</text>

  <line x1="670" y1="409" x2="670" y2="445" stroke="#334e68" stroke-width="2.5"/>
  <polygon points="670,455 663,440 677,440" fill="#334e68"/>

  <!-- Motor -->
  <rect x="560" y="460" rx="12" ry="12" width="220" height="40" fill="#102a43"/>
  <text x="670" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Hobby Motor (9V)</text>
</svg>
