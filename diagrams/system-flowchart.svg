<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-label="Anti Sleep Alarm software flowchart">
  <rect width="900" height="980" fill="#f8fafc"/>
  <text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Software Flowchart (Final Firmware)</text>

  <!-- START -->
  <rect x="350" y="60" rx="24" ry="24" width="200" height="48" fill="#0f172a"/>
  <text x="450" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fff">START</text>

  <line x1="450" y1="108" x2="450" y2="135" stroke="#334155" stroke-width="2"/>

  <rect x="300" y="135" rx="10" width="300" height="50" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">Initialize Arduino / outputs</text>

  <line x1="450" y1="185" x2="450" y2="215" stroke="#334155" stroke-width="2"/>

  <rect x="300" y="215" rx="10" width="300" height="50" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">Read debounced blink sensor</text>

  <line x1="450" y1="265" x2="450" y2="300" stroke="#334155" stroke-width="2"/>

  <!-- Decision -->
  <polygon points="450,300 570,360 450,420 330,360" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="450" y="355" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0c4a6e">Eye closed?</text>
  <text x="450" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#075985">(sensor HIGH)</text>

  <!-- NO branch -->
  <line x1="330" y1="360" x2="160" y2="360" stroke="#334155" stroke-width="2"/>
  <text x="230" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">NO</text>
  <rect x="40" y="330" rx="10" width="120" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="100" y="355" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#14532d">NORMAL</text>
  <text x="100" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">Motor ON</text>
  <line x1="100" y1="390" x2="100" y2="920" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="920" x2="450" y2="920" stroke="#334155" stroke-width="2"/>

  <!-- YES branch -->
  <line x1="450" y1="420" x2="450" y2="455" stroke="#334155" stroke-width="2"/>
  <text x="470" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">YES</text>

  <rect x="300" y="455" rx="10" width="300" height="50" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">Track closure time (millis)</text>

  <line x1="450" y1="505" x2="450" y2="540" stroke="#334155" stroke-width="2"/>

  <polygon points="450,540 590,600 450,660 310,600" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="450" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#7c2d12">Closed e 3 s?</text>

  <!-- warning no -->
  <line x1="310" y1="600" x2="180" y2="600" stroke="#334155" stroke-width="2"/>
  <text x="240" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">NO</text>
  <rect x="40" y="570" rx="10" width="140" height="60" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="110" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">EYE_CLOSED</text>
  <text x="110" y="615" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Keep monitoring</text>
  <line x1="110" y1="630" x2="110" y2="900" stroke="#334155" stroke-width="2"/>
  <line x1="110" y1="900" x2="450" y2="900" stroke="#334155" stroke-width="2"/>

  <!-- warning yes -->
  <line x1="450" y1="660" x2="450" y2="695" stroke="#334155" stroke-width="2"/>
  <text x="470" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">YES</text>

  <rect x="300" y="695" rx="10" width="300" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="726" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#92400e">Activate buzzer (WARNING)</text>

  <line x1="450" y1="745" x2="450" y2="780" stroke="#334155" stroke-width="2"/>

  <polygon points="450,780 590,840 450,900 310,840" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="835" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#7f1d1d">Closed e 4 s?</text>

  <!-- stop no -->
  <line x1="310" y1="840" x2="200" y2="840" stroke="#334155" stroke-width="2"/>
  <text x="250" y="830" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">NO</text>
  <rect x="40" y="810" rx="10" width="160" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="835" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#92400e">Continue warning</text>
  <text x="120" y="855" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#78350f">Motor still ON</text>
  <line x1="120" y1="870" x2="120" y2="900" stroke="#334155" stroke-width="2"/>

  <!-- stop yes -->
  <line x1="450" y1="900" x2="450" y2="930" stroke="#334155" stroke-width="2"/>
  <text x="470" y="920" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">YES</text>
  <rect x="300" y="930" rx="10" width="300" height="36" fill="#7f1d1d"/>
  <text x="450" y="953" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff">EMERGENCY_STOP (motor OFF)</text>
</svg>
